[workspace]
members = [
  "crates/identity-domain",
  "crates/identity-worker",
]
# Vendored third-party source remains independently testable, avoiding example-only
# development dependencies in this lockfile. / 第三方 vendored 源码保持独立测试，
# 避免将仅供示例使用的开发依赖引入本工作区锁文件。
exclude = ["crates/vendor/passkey-auth-worker"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kleedaisuki/moesegfault-indentity"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# wasm-bindgen 0.2.125+ needs the externref table; stripping all symbols removes it.
# wasm-bindgen 0.2.125+ 需要 externref table，不得删除全部符号。
strip = "debuginfo"
