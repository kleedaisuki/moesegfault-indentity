name: Cloudflare bootstrap

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to reconcile and verify / 要调和与验证的环境
        required: true
        default: staging
        type: choice
        options: [staging, production]
      platform_journey:
        description: Optional acceptance probe against already-deployed staging
        type: choice
        required: true
        default: skip
        options: [skip, http, mailbox]
      device_journey:
        description: Run the real device-code CLI and browser journey against deployed staging
        type: boolean
        required: true
        default: false
      amail_device_client:
        description: Enable the existing amail native client's device grant only, without service deployment
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Reconcile Cloudflare infrastructure
    if: (inputs.platform_journey == 'skip' && !inputs.device_journey) || inputs.target == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-${{ inputs.target }}
    concurrency: {group: 'cloudflare-${{ inputs.target }}', cancel-in-progress: false}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Check out repository / 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js / 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked tooling / 安装锁定工具
        run: npm ci --ignore-scripts
      - name: Select one staging acceptance journey
        if: inputs.device_journey
        run: test '${{ inputs.target }}' = staging && test '${{ inputs.platform_journey }}' = skip && test '${{ inputs.amail_device_client }}' != true
      - name: Select registration-only operation
        if: inputs.amail_device_client
        run: test '${{ inputs.platform_journey }}' = skip && test '${{ inputs.device_journey }}' != true
      - name: Enable only the existing amail client's device grant
        if: inputs.amail_device_client
        env:
          WRANGLER_SEND_METRICS: false
        run: node scripts/enable-amail-device-client.mjs '${{ inputs.target }}'
      - name: Reconcile data, domains, and email / 调和数据、域名与邮件
        if: inputs.platform_journey == 'skip' && !inputs.device_journey && !inputs.amail_device_client
        run: scripts/bootstrap-cloudflare.sh "${{ inputs.target }}"
      - name: Install the device journey browser
        if: inputs.target == 'staging' && inputs.device_journey
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.temp/browsers
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify remote device login through the real browser and CLI
        id: device-journey
        if: inputs.target == 'staging' && inputs.device_journey
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.temp/browsers
          WRANGLER_SEND_METRICS: false
        run: node scripts/device-journey.mjs
      - name: Remove owned staging device credentials and protocol state
        if: always() && steps.device-journey.outcome != 'skipped' && inputs.target == 'staging' && inputs.device_journey
        env:
          WRANGLER_SEND_METRICS: false
        run: node scripts/lib/device-journey-fixture.mjs --cleanup
      - name: Save device journey evidence without credential files
        if: always() && steps.device-journey.outcome != 'skipped' && inputs.target == 'staging' && inputs.device_journey
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-journey-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .temp/device-staging-*/summary.json
            .temp/device-staging-*/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate the staging journey helpers and fixture
        if: inputs.target == 'staging' && inputs.platform_journey != 'skip'
        run: |
          node --test scripts/tests/platform-journey-http.mjs
          node scripts/tests/platform-journey.mjs
      - name: Probe the already-deployed staging platform
        id: platform-journey
        if: inputs.target == 'staging' && inputs.platform_journey != 'skip'
        timeout-minutes: 18
        env:
          PLATFORM_JOURNEY_RECIPIENT: ${{ secrets.PLATFORM_JOURNEY_RECIPIENT }}
          PLATFORM_JOURNEY_MODE: ${{ inputs.platform_journey }}
          WRANGLER_SEND_METRICS: false
        run: node scripts/platform-journey.mjs
      - name: Diagnose failed staging journey delivery without the fixture API
        if: always() && steps.platform-journey.outcome == 'failure' && inputs.target == 'staging' && inputs.platform_journey != 'skip'
        continue-on-error: true
        timeout-minutes: 1
        env:
          WRANGLER_SEND_METRICS: false
        run: bash scripts/platform-journey-diagnostics.sh
      - name: Restore the inert staging fixture after the requested journey
        if: always() && steps.platform-journey.outcome != 'skipped' && inputs.target == 'staging' && inputs.platform_journey != 'skip'
        env:
          WRANGLER_SEND_METRICS: false
        run: bash scripts/platform-journey-cleanup.sh
