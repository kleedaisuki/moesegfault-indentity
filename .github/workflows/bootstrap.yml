name: Cloudflare bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Verify or provision data resources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-deployment
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository / 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js / 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked tooling / 安装锁定工具
        run: npm ci --ignore-scripts
      - name: Bootstrap idempotently / 幂等执行引导
        run: scripts/bootstrap-cloudflare.sh
