name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24.8.0

jobs:
  rust:
    name: Rust quality and Worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Cache Cargo data / 缓存 Cargo 数据
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.88.0-wb0.8.5-deny0.20.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-1.88.0-wb0.8.5-deny0.20.2-
      - name: Confirm pinned toolchain / 确认固定工具链
        run: rustc --version && cargo --version && rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - name: Install pinned tools / 安装固定工具
        run: |
          command -v worker-build >/dev/null || cargo install worker-build --version 0.8.5 --locked
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.20.2 --locked
      - name: Format, lint, and test / 格式、静态检查与测试
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo deny --locked check
      - name: Verify vendored WebAuthn and WASM / 验证 WebAuthn 补丁与 WASM
        run: |
          cargo fmt --manifest-path crates/vendor/passkey-auth-worker/Cargo.toml -- --check
          cargo test --manifest-path crates/vendor/passkey-auth-worker/Cargo.toml --locked --lib --tests
          cargo check --manifest-path crates/vendor/passkey-auth-worker/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --package identity-worker --target wasm32-unknown-unknown --locked
      - name: Build identity Worker / 构建 Identity Worker
        working-directory: crates/identity-worker
        run: worker-build --release
      - name: Upload identity artifact / 上传 Identity 制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-worker-${{ github.sha }}
          path: crates/identity-worker/build/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: ${{ matrix.app }} frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [login, account]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies / 安装锁定依赖
        run: npm ci --ignore-scripts
      - name: Dependency advisory gate / 依赖公告门禁
        run: npm audit --audit-level=high
      - name: Lint, typecheck, and test / 静态、类型检查与测试
        run: |
          npm run lint --workspace=@moesegfault/${{ matrix.app }}
          npm run typecheck --workspace=@moesegfault/${{ matrix.app }}
          npm run test --workspace=@moesegfault/${{ matrix.app }} -- --run
      - name: Build / 构建
        run: npm run build --workspace=@moesegfault/${{ matrix.app }}
      - name: Upload immutable frontend artifact / 上传不可变前端制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}-assets-${{ github.sha }}
          path: apps/${{ matrix.app }}/dist/
          if-no-files-found: error
          retention-days: 14

  contracts:
    name: Contracts, migrations, config, scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate contracts and fresh migration / 验证契约与全新迁移
        run: npm run lint:openapi && npm run migrate:local && npm run test:migrations
      - name: Validate scripts and JSONC / 验证脚本与 JSONC
        run: |
          shellcheck scripts/*.sh
          jq -e . wrangler.identity.jsonc wrangler.login.jsonc wrangler.account.jsonc >/dev/null

  package:
    name: Immutable deployment package
    needs: [rust, frontend, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: npm ci --ignore-scripts
      - name: Download tested artifacts / 下载已测试制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-${{ github.sha }}'
          path: .temp/artifacts
      - name: Restore artifact layout / 恢复制品目录
        run: |
          mkdir -p crates/identity-worker/build apps/login/dist apps/account/dist
          cp -a .temp/artifacts/identity-worker-${GITHUB_SHA}/. crates/identity-worker/build/
          cp -a .temp/artifacts/login-assets-${GITHUB_SHA}/. apps/login/dist/
          cp -a .temp/artifacts/account-assets-${GITHUB_SHA}/. apps/account/dist/
      - name: Dry-run every deployment unit / 演练所有发布单元
        run: |
          npx --no-install wrangler deploy --dry-run --outdir=dist/dry-run/identity --env production --config wrangler.identity.jsonc
          npx --no-install wrangler deploy --dry-run --outdir=dist/dry-run/login --env production --config wrangler.login.jsonc
          npx --no-install wrangler deploy --dry-run --outdir=dist/dry-run/account --env production --config wrangler.account.jsonc
      - name: Create checksummed release bundle / 创建带校验和的发布包
        run: |
          tar -czf release-${GITHUB_SHA}.tar.gz crates/identity-worker/build apps/login/dist apps/account/dist migrations wrangler.*.jsonc scripts
          sha256sum release-${GITHUB_SHA}.tar.gz > release-${GITHUB_SHA}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release-${{ github.sha }}.*
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy and verify staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: cloudflare-staging
      url: https://login-staging.moesegfault.dev
    concurrency: {group: cloudflare-staging, cancel-in-progress: false}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_MESSAGE: Staging GitHub ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'release-${{ github.sha }}'}
      - name: Verify, deploy, and check / 验证、发布与检查
        run: |
          sha256sum --check release-${GITHUB_SHA}.sha256
          tar -xzf release-${GITHUB_SHA}.tar.gz
          scripts/release.sh staging

  deploy-production:
    name: Promote verified revision to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: cloudflare-production
      url: https://login.moesegfault.dev
    concurrency: {group: cloudflare-production, cancel-in-progress: false}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_MESSAGE: Production GitHub ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'release-${{ github.sha }}'}
      - name: Verify, reject stale run, and promote / 验证、拒绝过期任务并提升
        run: |
          sha256sum --check release-${GITHUB_SHA}.sha256
          tar -xzf release-${GITHUB_SHA}.tar.gz
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          scripts/release.sh production

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [rust, frontend, contracts, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all quality jobs / 要求所有质量任务通过
        env:
          RUST: ${{ needs.rust.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$RUST $FRONTEND $CONTRACTS $PACKAGE" = "success success success success"
