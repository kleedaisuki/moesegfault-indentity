name: Rollback deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment / 目标环境
        required: true
        default: production
        type: choice
        options: [staging, production]
      identity_version:
        description: Identity Worker version ID / Identity Worker 版本 ID
        required: true
        type: string
      login_version:
        description: Login Worker version ID / Login Worker 版本 ID
        required: true
        type: string
      account_version:
        description: Account Worker version ID / Account Worker 版本 ID
        required: true
        type: string
      notifications_version:
        description: Optional Notifications Worker version ID
        required: false
        type: string
      decisions_version:
        description: Optional Decisions Worker version ID
        required: false
        type: string
      reason:
        description: Auditable rollback reason / 可审计回滚理由
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back all Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IDENTITY_VERSION: ${{ inputs.identity_version }}
      LOGIN_VERSION: ${{ inputs.login_version }}
      ACCOUNT_VERSION: ${{ inputs.account_version }}
      NOTIFICATIONS_VERSION: ${{ inputs.notifications_version }}
      DECISIONS_VERSION: ${{ inputs.decisions_version }}
      TARGET: ${{ inputs.target }}
      ROLLBACK_REASON: ${{ inputs.reason }}
    steps:
      - name: Check out runbook and scripts / 检出手册与脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js / 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
      - name: Install locked deployment tooling / 安装锁定发布工具
        run: npm ci --ignore-scripts
      - name: Roll back and smoke / 回滚并冒烟检查
        run: |
          if [[ -n "$NOTIFICATIONS_VERSION" || -n "$DECISIONS_VERSION" ]]; then
            test -n "$NOTIFICATIONS_VERSION" && test -n "$DECISIONS_VERSION"
            scripts/rollback.sh "$TARGET" "$IDENTITY_VERSION" "$LOGIN_VERSION" "$ACCOUNT_VERSION" "$NOTIFICATIONS_VERSION" "$DECISIONS_VERSION"
          else
            scripts/rollback.sh "$TARGET" "$IDENTITY_VERSION" "$LOGIN_VERSION" "$ACCOUNT_VERSION"
          fi
