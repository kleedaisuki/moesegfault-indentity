# Dependency policy / 依赖管理策略。
[advisories]
ignore = []
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Local workspace paths do not resolve through a registry. / 本地 workspace 路径不通过 registry 解析。
allow-wildcard-paths = true
highlight = "all"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "MIT",
  "Unicode-3.0",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
