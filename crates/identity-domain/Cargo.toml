[package]
name = "identity-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[dependencies]
base64 = "0.22.1"
hmac = "0.13.0"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7", "js"] }

[dev-dependencies]
serde_json = "1.0.143"
