[package]
name = "identity-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
futures-util = "0.3.34"
getrandom = { version = "=0.2.17", features = ["js"] }
identity-domain = { version = "=0.1.0", path = "../identity-domain" }
js-sys = "=0.3.102"
passkey-auth = { version = "=0.1.3", path = "../vendor/passkey-auth-worker" }
rand = "0.10.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
time = { version = "=0.3.55", default-features = false, features = ["formatting"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7", "js"] }
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
web-sys = { version = "=0.3.102", features = ["Crypto", "CryptoKey", "RsaHashedImportParams", "SubtleCrypto"] }
worker = { version = "=0.8.5", features = ["d1"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
